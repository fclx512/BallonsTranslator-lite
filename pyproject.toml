[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BallonsTranslator-lite"
description = "漫画/图片翻译工具 — 文字检测 → OCR → 翻译 → 图像修复 → 文字渲染"
requires-python = ">=3.10"
dependencies = [
  "colorama",
  "einops",
  "httpx[socks,brotli]",
  "natsort",
  "networkx>=3.0",
  "numpy",
  "openai>=2.8.1",
  "opencc-python-reimplemented",
  "opencv-python>=4.10.0.84; sys_platform == 'win32' or sys_platform == 'linux'",
  "packaging>=23.0",
  "pillow>=11.0",
  "pillow-jxl-plugin>=1.3.4",
  "py7zr",
  "pyclipper",
  "pydantic>=2.0",
  "PyQt6>=6.8.1",
  "PyQt6-Qt6>=6.8.1",
  "pywin32; sys_platform == 'win32'",
  "pyyaml",
  "qtpy",
  "requests",
  "shapely",
  "termcolor",
  "tomli; python_version < '3.11'",
  "tqdm",
]

[project.optional-dependencies]
gpu = ["torch", "torchvision", "transformers", "diffusers", "ultralytics>=8.4.14"]
mcp = ["mcp>=1.0.0"]
onnx = ["onnxruntime-gpu", "onnxocr"]

[tool.ruff]
target-version = "py310"
exclude = ["modules/textdetector/yolov5"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

# __init__.py 中导入再导出是标准做法，不报 F401
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
norecursedirs = [".git", "node_modules"]
