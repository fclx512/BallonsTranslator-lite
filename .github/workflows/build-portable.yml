name: Build Portable Package

on:
  workflow_dispatch:
    inputs:
      python_ver:
        description: 'Python version for embedded distribution'
        required: false
        default: '3.12.4'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to upload release assets

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all tags for version detection

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # 7z is pre-installed on GitHub Actions Windows runners
          where 7z

      - name: Cache embedded Python
        id: cache-embed
        uses: actions/cache@v4
        with:
          path: .build_cache
          key: embed-py-${{ github.event.inputs.python_ver || '3.12.4' }}

      - name: Build portable package
        id: build
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.python_ver || '3.12.4' }}"
          python scripts/build_portable.py --python-ver $ver
          $archive = (Get-ChildItem release/*.7z | Select-Object -First 1 -ExpandProperty Name)
          echo "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BallonsTranslator-lite-portable
          path: release/*.7z
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.7z
          generate_release_notes: true
