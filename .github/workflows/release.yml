# BallonsTranslator-lite Release Build
#
# Triggered by pushing a tag matching v* (e.g. v1.0.0, v1.1.0-beta).
# Builds a standalone Windows executable with Nuitka and publishes it
# as a GitHub Release.
---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies (msvc-runtime for Nuitka)
        run: |
          choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
        shell: pwsh

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project dependencies (CPU — no torch for build)
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -e .

      - name: Install build-time Qt plugins
        run: |
          pip install PyQt6 PyQt6-Qt6

      - name: Generate manifest
        run: python scripts/generate_manifest.py

      - name: Build with Nuitka
        run: scripts\build_win.bat
        shell: cmd
        env:
          # Skip torch/GPU detection during build
          BALLOONTRANS_CPU_ONLY: "1"

      - name: Prepare artifact name
        id: artifact
        run: |
          $tag = "${{ github.ref_name }}"
          echo "name=BallonsTranslator-lite-$tag-win64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: pwsh

      - name: Create ZIP archive
        run: |
          $src = "release\launch.dist"
          $dst = "${{ steps.artifact.outputs.name }}.zip"
          Compress-Archive -Path $src -DestinationPath $dst
          echo "Archive created: $dst"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BallonsTranslator-lite ${{ github.ref_name }}
          body: |
            ## BallonsTranslator-lite ${{ github.ref_name }}

            ### Windows 便携版

            - 下载 `${{ steps.artifact.outputs.name }}.zip`
            - 解压后运行 `launch.bat` 启动
            - 模型文件和 GPU 依赖按需安装

            ### 更新日志

            详见 [CHANGELOG](docs/CHANGELOG.md)
          files: |
            *.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
